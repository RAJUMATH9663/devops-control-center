global:
  environment: production
  domain: devops.internal

backend:
  replicaCount: 2
  image:
    repository: devops-control-center-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi
  env:
    PROJECT_NAME: "DevOps Control Center"
    LOG_LEVEL: "INFO"
    ACCESS_TOKEN_EXPIRE_MINUTES: 1440

frontend:
  replicaCount: 2
  image:
    repository: devops-control-center-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
  auth:
    postgresPassword: "postgrespassword"
    database: "devops_db"
    username: "postgres"
  persistence:
    size: 20Gi
    storageClass: "gp3"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "devops-backend-svc"
  hosts:
    - host: control-center.devops.internal
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /ws
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: devops-control-center-tls
      hosts:
        - control-center.devops.internal
