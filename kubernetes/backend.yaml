apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: devops-control-center
  labels:
    app: devops-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: devops-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-backend
  namespace: devops-control-center
  labels:
    app: devops-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devops-backend
  template:
    metadata:
      labels:
        app: devops-backend
    spec:
      containers:
        - name: backend
          image: devops-control-center-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: devops-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-secrets
                  key: SECRET_KEY
            - name: PROJECT_NAME
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: PROJECT_NAME
            - name: API_V1_STR
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: API_V1_STR
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
